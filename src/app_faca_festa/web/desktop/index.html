<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faça a Festa — Windows</title>
<style>body{font:16px system-ui;background:#f2f8f7;color:#163a35;padding:48px 24px}main{max-width:540px;margin:auto;background:white;padding:32px;border-radius:16px}a{display:inline-block;background:#009688;color:white;padding:14px 20px;border-radius:8px;text-decoration:none}a[hidden]{display:none}small{display:block;margin-top:24px}</style></head>
<body><main><h1>Faça a Festa</h1><p>Instalador Windows 10 e 11, 64 bits.</p><p id="version">Consultando versão…</p><a id="download" hidden>Baixar instalador Windows</a><small>Clientes antigos precisam instalar esta versão uma vez. As próximas versões podem ser instaladas pelo aplicativo, com sua confirmação. Dados e configurações existentes são preservados.</small></main>
<script>fetch('/desktop/updates/latest.json',{cache:'no-store',signal:AbortSignal.timeout(15000)}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(d.identity!=='faca-festa-windows-x64')throw Error();const u=new URL(d.url);if(u.protocol!=='https:')throw Error();document.getElementById('version').textContent='Versão '+d.version+' • build '+d.build;const a=document.getElementById('download');a.href=u.href;a.hidden=false}).catch(()=>document.getElementById('version').textContent='Instalador indisponível. Tente novamente mais tarde.')</script></body></html>
