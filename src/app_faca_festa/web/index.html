<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Faça a Festa">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Faça a Festa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Faça a Festa</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffe4e1;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #880e4f;
      z-index: 9999;
    }
    #boot .spin {
      width: 36px;
      height: 36px;
      border: 3px solid #f8bbd0;
      border-top-color: #c2185b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="spin"></div>
    <div>Faça a Festa</div>
    <div id="boot-msg" style="margin-top:8px;font-size:14px;">Abrindo seu convite...</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    function removeBoot() {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    }
    window.addEventListener('flutter-first-frame', removeBoot);
    setTimeout(removeBoot, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
