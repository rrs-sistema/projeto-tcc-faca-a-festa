plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def calculadoraQa = project.hasProperty("calculadoraQa") ||
    (project.findProperty("dart-defines") ?: "").split(",").any { valor ->
        valor && new String(valor.decodeBase64(), "UTF-8") == "CALCULADORA_QA=true"
    }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

if (keystoreProperties['keyAlias'] == 'ieadc') {
    throw new GradleException(
        "Assinatura de release aponta para o keystore de outro aplicativo (alias ieadc). " +
        "Crie a chave do Faça a Festa com: powershell -ExecutionPolicy Bypass -File android/create-upload-keystore.ps1"
    )
}

android {
    namespace = "com.rrs.system.technology.facafesta"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.rrs.system.technology.facafesta"
        manifestPlaceholders["appLabel"] = "Faça a Festa"
        // QA usa outro pacote e repositórios locais; não substitui o app do usuário.
        if (calculadoraQa) {
            applicationIdSuffix ".calculadoraqa"
            manifestPlaceholders["appLabel"] = "Faça a Festa QA"
        }
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// O alvo de QA não inicializa Firebase nem utiliza credenciais do aplicativo.
if (calculadoraQa) {
    tasks.configureEach { task ->
        if (task.name.endsWith("GoogleServices")) task.enabled = false
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            throw new GradleException("O alvo calculadoraQa só pode ser executado em debug.")
        }
    }
}
