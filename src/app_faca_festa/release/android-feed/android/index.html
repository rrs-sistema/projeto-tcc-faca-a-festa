<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faça a Festa — Android</title>
<style>body{font:16px system-ui;background:#f2f8f7;color:#163a35;padding:48px 24px}main{max-width:540px;margin:auto;background:white;padding:32px;border-radius:16px}a{display:inline-block;background:#009688;color:white;padding:14px 20px;border-radius:8px;text-decoration:none}a[hidden]{display:none}small{display:block;margin-top:24px}</style></head>
<body><main><h1>Faça a Festa</h1><p>Aplicativo para Android 7.0 ou superior.</p><p id="version">Consultando versão…</p><a id="download" hidden>Baixar aplicativo Android</a><small>Este arquivo APK permite a instalação direta no aparelho. O Android pode solicitar autorização para instalar aplicativos baixados pelo navegador.</small></main>
<script>fetch('/android/latest.json',{cache:'no-store',signal:AbortSignal.timeout(15000)}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(d.identity!=='faca-festa-android'||d.published!==true)throw Error();const u=new URL(d.url);if(u.protocol!=='https:'||u.hostname!=='firebasestorage.googleapis.com'||!u.pathname.startsWith('/v0/b/faca-a-festa.firebasestorage.app/o/android-faca-festa%2F'))throw Error();document.getElementById('version').textContent='Versão '+d.version+' • build '+d.build;const a=document.getElementById('download');a.href=u.href;a.hidden=false}).catch(()=>document.getElementById('version').textContent='Aplicativo indisponível. Tente novamente mais tarde.')</script></body></html>
