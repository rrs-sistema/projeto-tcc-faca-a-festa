name: Goldens (Linux)

# Roda os testes de golden num ambiente fixo (ubuntu) para separar falhas de
# renderização do Windows das falhas reais de layout.
on:
  workflow_dispatch:
  pull_request:

jobs:
  goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app_faca_festa
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.2
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Testes (incluindo goldens)
        run: flutter test

      - name: Imagens das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: src/app_faca_festa/test/**/failures/
          if-no-files-found: ignore
